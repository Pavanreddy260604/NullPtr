  <!-- 🛡️ Nuclear Storage Shield (Must be first to prevent module crashes) -->
  <script>
    (function () {
      const createSafeStorage = (t) => {
        try {
          const k = "__s_t__";
          window[t].setItem(k, k);
          window[t].removeItem(k);
          return window[t];
        } catch (e) {
          const s = {};
          return {
            getItem: (k) => s[k] || null,
            setItem: (k, v) => { s[k] = String(v); },
            removeItem: (k) => { delete s[k]; },
            clear: () => { for (let x in s) delete s[x]; },
            key: (i) => Object.keys(s)[i] || null,
            get length() { return Object.keys(s).length; }
          };
        }
      };
      try {
        if (!window.localStorage) window.localStorage = createSafeStorage('localStorage');
        if (!window.sessionStorage) window.sessionStorage = createSafeStorage('sessionStorage');
      } catch (e) { }
      const isErr = (e) => {
        const m = (e?.message || (typeof e === 'string' ? e : '')).toLowerCase();
        return m.includes('access to storage is not allowed') || m.includes('securityerror') || m.includes('idbdatabase') || m.includes('indexeddb');
      };
      window.addEventListener('unhandledrejection', (ev) => { if (isErr(ev.reason)) { ev.preventDefault(); ev.stopPropagation(); } }, true);
      window.addEventListener('error', (ev) => { if (isErr(ev.error) || isErr(ev.message)) { ev.stopImmediatePropagation(); } }, true);
    })();
  </script>

  <!-- Preconnect to external resources for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
